substitutions:
  # The Home Assistant to-do list Wilbur shows. Change to your list's entity id.
  todo_entity: todo.studio_jobs

esphome:
  name: wilbur
  friendly_name: Wilbur
  on_boot:
    priority: -100
    then:
      - script.execute: inactivity
      - script.execute: set_base_mood
      - binary_sensor.template.publish:
          id: asleep_sensor
          state: false

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Wilbur Fallback"
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key
  homeassistant_services: true
  on_client_connected:
    - script.execute: fetch_tasks
  actions:
    - action: alert
      variables:
        title: string
        message: string
        level: int
        timeout: int
      then:
        - script.execute:
            id: enqueue_alert
            title: !lambda 'return title;'
            message: !lambda 'return message;'
            level: !lambda 'return level;'
            timeout: !lambda 'return timeout;'

ota:
  - platform: esphome
    password: !secret ota_password

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11

i2c:
  sda: GPIO16
  scl: GPIO15

output:
  - platform: ledc
    pin: GPIO45
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

globals:
  - id: chill_on
    type: bool
    initial_value: 'false'
  - id: q_title
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>()'
  - id: q_msg
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>()'
  - id: q_level
    type: std::vector<int>
    initial_value: 'std::vector<int>()'
  - id: q_timeout
    type: std::vector<int>
    initial_value: 'std::vector<int>()'
  - id: cur_level
    type: int
    initial_value: '0'
  - id: cur_timeout
    type: int
    initial_value: '0'
  - id: alert_active
    type: bool
    initial_value: 'false'
  - id: alert_shown_at
    type: uint32_t
    initial_value: '0'
  - id: tasks_shown_at
    type: uint32_t
    initial_value: '0'
  - id: tasks_open
    type: bool
    initial_value: 'false'
  - id: task_names
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>()'
  - id: task_uids
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>()'
  - id: mood
    type: int
    initial_value: '0'
  - id: asleep
    type: bool
    initial_value: 'false'
  - id: focus_running
    type: bool
    initial_value: 'false'
  - id: focus_remaining
    type: int
    initial_value: '0'

display:
  - platform: mipi_spi
    id: tft
    model: ILI9341
    cs_pin: GPIO10
    dc_pin: GPIO46
    invert_colors: true
    data_rate: 40MHz
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: ft63x6
    id: touch
    display: tft
    interrupt_pin: GPIO17
    reset_pin: GPIO18
    calibration:
      x_min: 0
      x_max: 239
      y_min: 0
      y_max: 319
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "x=%d y=%d  raw: x_raw=%d y_raw=%d", touch.x, touch.y, touch.x_raw, touch.y_raw);
      - script.execute: wake

text_sensor:
  - platform: template
    name: "Mood"
    id: mood_text
    icon: mdi:emoticon-outline

binary_sensor:
  - platform: template
    name: "Asleep"
    id: asleep_sensor
    icon: mdi:sleep

switch:
  - platform: template
    name: "Focus"
    id: focus_switch
    restore_mode: DISABLED
    turn_on_action:
      - script.execute: focus_timer
    turn_off_action:
      - script.execute: focus_stop
  - platform: template
    name: "Chill"
    id: chill_switch
    restore_mode: DISABLED
    turn_on_action:
      - script.execute:
          id: set_chill
          enable: true
    turn_off_action:
      - script.execute:
          id: set_chill
          enable: false

number:
  - platform: template
    name: "Focus duration"
    id: focus_minutes
    icon: mdi:timer-outline
    unit_of_measurement: "min"
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 25
    restore_value: true
    optimistic: true
    mode: box

button:
  - platform: template
    name: "Wake"
    on_press:
      - script.execute: cheer

interval:
  - interval: 3500ms
    then:
      - script.execute: blink
  - interval: 5min
    then:
      - script.execute: fetch_tasks

script:
  - id: fetch_tasks
    mode: single
    then:
      - homeassistant.action:
          action: todo.get_items
          data:
            entity_id: ${todo_entity}
            status: needs_action
          capture_response: true
          on_success:
            - lambda: |-
                std::string raw;
                serializeJson(response, raw);
                ESP_LOGI("tasks", "todo.get_items reply: %s", raw.c_str());
                std::vector<std::string> names;
                std::vector<std::string> uids;
                auto add_items = [&](JsonVariantConst items) {
                  if (!items.is<JsonArrayConst>()) return;
                  for (JsonObjectConst it : items.as<JsonArrayConst>()) {
                    names.push_back(std::string(it["summary"] | ""));
                    uids.push_back(std::string(it["uid"] | ""));
                  }
                };
                JsonObjectConst root = response;
                if (root["response"].is<JsonObjectConst>()) root = root["response"];
                add_items(root["items"]);
                for (JsonPairConst kv : root) {
                  if (kv.value().is<JsonObjectConst>()) add_items(kv.value()["items"]);
                }
                ESP_LOGI("tasks", "parsed %d open items", (int) names.size());
                id(task_names) = names;
                id(task_uids) = uids;
            - script.execute: render_tasks
          on_error:
            - logger.log:
                format: "todo.get_items failed: %s"
                args: ['error.c_str()']

  - id: render_tasks
    then:
      - lambda: |-
          lv_obj_t *rows[] = {id(task_row_1), id(task_row_2), id(task_row_3), id(task_row_4), id(task_row_5)};
          lv_obj_t *lbls[] = {id(task_lbl_1), id(task_lbl_2), id(task_lbl_3), id(task_lbl_4), id(task_lbl_5)};
          const size_t slots = sizeof(rows) / sizeof(rows[0]);
          const size_t n = id(task_names).size();

          for (size_t i = 0; i < slots; i++) {
            if (i < n) {
              lv_label_set_text(lbls[i], id(task_names)[i].c_str());
              lv_obj_remove_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
            }
          }

          if (n == 0) lv_obj_remove_flag(id(task_empty), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(task_empty), LV_OBJ_FLAG_HIDDEN);

          std::string btn = "Tasks";
          lv_label_set_text(id(tasks_btn_label), btn.c_str());

          std::string hint = n > slots
              ? "+" + std::to_string(n - slots) + " more - tap the check to complete"
              : "Tap the check to complete a task";
          lv_label_set_text(id(task_hint), hint.c_str());

  - id: complete_task
    parameters:
      idx: int
    then:
      - if:
          condition:
            lambda: 'return idx >= 1 && (size_t) idx <= id(task_uids).size() && (millis() - id(tasks_shown_at)) > 600;'
          then:
            - homeassistant.action:
                action: todo.update_item
                data:
                  entity_id: ${todo_entity}
                  status: completed
                  item: !lambda 'return id(task_uids)[idx - 1];'
            - lambda: |-
                id(task_names).erase(id(task_names).begin() + (idx - 1));
                id(task_uids).erase(id(task_uids).begin() + (idx - 1));
            - script.execute: render_tasks
            - script.execute: cheer
            - delay: 3s
            - script.execute: fetch_tasks

  - id: show_tasks
    then:
      - script.execute: wake
      - script.execute: fetch_tasks
      - globals.set:
          id: tasks_shown_at
          value: !lambda 'return millis();'
      - globals.set:
          id: tasks_open
          value: 'true'
      - lvgl.page.show: tasks_page

  - id: set_chill
    parameters:
      enable: bool
    then:
      - globals.set:
          id: chill_on
          value: !lambda 'return enable;'
      - switch.template.publish:
          id: chill_switch
          state: !lambda 'return enable;'
      - lvgl.widget.update:
          id: chill_btn
          bg_color: !lambda 'return enable ? lv_color_hex(0x2F8FB8) : lv_color_hex(0x2A3A55);'
      - script.execute: set_base_mood

  - id: apply_mood
    parameters:
      m: int
    then:
      - globals.set:
          id: mood
          value: !lambda 'return m;'
      - lambda: |-
          const char *names[] = {"idle", "happy", "focused", "sleepy", "chill"};
          std::string s = names[(m >= 0 && m <= 4) ? m : 0];
          if (id(mood_text).state != s) id(mood_text).publish_state(s);
          // 0 idle, 1 happy, 2 focused, 3 sleepy, 4 chill: show the matching face, hide the rest
          lv_obj_t *faces[] = {id(mood_idle), id(mood_happy), id(mood_focus), id(mood_sleepy), id(mood_chill)};
          lv_obj_add_flag(id(mood_blink), LV_OBJ_FLAG_HIDDEN);
          for (int i = 0; i < 5; i++) {
            if (i == m) lv_obj_remove_flag(faces[i], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(faces[i], LV_OBJ_FLAG_HIDDEN);
          }

  - id: set_base_mood
    then:
      - script.execute:
          id: apply_mood
          m: !lambda 'return id(focus_running) ? 2 : (id(asleep) ? 3 : (id(chill_on) ? 4 : 0));'

  - id: cheer
    mode: restart
    then:
      - script.execute:
          id: apply_mood
          m: 1
      - delay: 3s
      - script.execute: set_base_mood

  - id: blink
    then:
      - if:
          condition:
            lambda: 'return id(mood) == 0 || id(mood) == 2;'
          then:
            - lvgl.widget.hide: mood_idle
            - lvgl.widget.hide: mood_focus
            - lvgl.widget.show: mood_blink
            - delay: 150ms
            - script.execute:
                id: apply_mood
                m: !lambda 'return id(mood);'

  - id: inactivity
    mode: restart
    then:
      - delay: 60s
      - if:
          condition:
            lambda: 'return !id(focus_running);'
          then:
            - globals.set:
                id: asleep
                value: 'true'
            - binary_sensor.template.publish:
                id: asleep_sensor
                state: true
            - script.execute: set_base_mood
            - if:
                condition:
                  lambda: 'return id(tasks_open);'
                then:
                  - globals.set:
                      id: tasks_open
                      value: 'false'
                  - lvgl.page.show: face_page
            - light.turn_on:
                id: backlight
                brightness: 15%

  - id: wake
    then:
      - if:
          condition:
            lambda: 'return id(asleep);'
          then:
            - globals.set:
                id: asleep
                value: 'false'
            - binary_sensor.template.publish:
                id: asleep_sensor
                state: false
            - light.turn_on:
                id: backlight
                brightness: 100%
            - script.execute: set_base_mood
      - script.execute: inactivity

  - id: focus_timer
    mode: restart
    then:
      - globals.set:
          id: focus_remaining
          value: !lambda 'return (int) (id(focus_minutes).state * 60);'
      - globals.set:
          id: focus_running
          value: 'true'
      - switch.template.publish:
          id: focus_switch
          state: ON
      - lvgl.label.update:
          id: focus_btn_label
          text: "Stop"
      - script.execute: wake
      - script.execute: set_base_mood
      - while:
          condition:
            lambda: 'return id(focus_remaining) > 0;'
          then:
            - lvgl.label.update:
                id: status_label
                text:
                  format: "Focus %02d:%02d"
                  args: ['id(focus_remaining) / 60', 'id(focus_remaining) % 60']
            - delay: 1s
            - lambda: 'id(focus_remaining)--;'
      - globals.set:
          id: focus_running
          value: 'false'
      - switch.template.publish:
          id: focus_switch
          state: OFF
      - lvgl.label.update:
          id: focus_btn_label
          text: "Focus"
      - lvgl.label.update:
          id: status_label
          text: "Done!"
      - script.execute: cheer
      - script.execute: inactivity

  - id: focus_stop
    then:
      - script.stop: focus_timer
      - globals.set:
          id: focus_running
          value: 'false'
      - switch.template.publish:
          id: focus_switch
          state: OFF
      - lvgl.label.update:
          id: focus_btn_label
          text: "Focus"
      - lvgl.label.update:
          id: status_label
          text: ""
      - script.execute: set_base_mood

  - id: enqueue_alert
    mode: queued
    parameters:
      title: string
      message: string
      level: int
      timeout: int
    then:
      - lambda: |-
          // keep at most 8 waiting alerts; drop the oldest if full
          if (id(q_title).size() >= 8) {
            id(q_title).erase(id(q_title).begin());
            id(q_msg).erase(id(q_msg).begin());
            id(q_level).erase(id(q_level).begin());
            id(q_timeout).erase(id(q_timeout).begin());
          }
          id(q_title).push_back(title);
          id(q_msg).push_back(message);
          id(q_level).push_back(level);
          id(q_timeout).push_back(timeout);
      - if:
          condition:
            lambda: 'return !id(alert_active);'
          then:
            - script.execute: next_alert
          else:
            - lvgl.label.update:
                id: alert_more
                text: !lambda |-
                  std::string more = "+" + std::to_string(id(q_title).size()) + " more";
                  return more;

  - id: next_alert
    mode: restart
    then:
      - script.stop: alert_timeout
      - if:
          condition:
            lambda: 'return id(q_title).empty();'
          then:
            - globals.set:
                id: alert_active
                value: 'false'
            - globals.set:
                id: tasks_open
                value: 'false'
            - lvgl.page.show: face_page
          else:
            - script.execute: wake
            - lambda: |-
                id(cur_level) = id(q_level).front();
                id(cur_timeout) = id(q_timeout).front();
            - lvgl.label.update:
                id: alert_title
                text: !lambda 'return id(q_title).front();'
            - lvgl.label.update:
                id: alert_msg
                text: !lambda 'return id(q_msg).front();'
            - lambda: |-
                id(q_title).erase(id(q_title).begin());
                id(q_msg).erase(id(q_msg).begin());
                id(q_level).erase(id(q_level).begin());
                id(q_timeout).erase(id(q_timeout).begin());
            - lvgl.label.update:
                id: alert_more
                text: !lambda |-
                  if (id(q_title).empty()) return std::string("");
                  return "+" + std::to_string(id(q_title).size()) + " more";
            - lvgl.widget.hide: alert_hdr_info
            - lvgl.widget.hide: alert_hdr_warn
            - lvgl.widget.hide: alert_hdr_crit
            - if:
                condition:
                  lambda: 'return id(cur_level) >= 2;'
                then:
                  - lvgl.widget.show: alert_hdr_crit
                else:
                  - if:
                      condition:
                        lambda: 'return id(cur_level) == 1;'
                      then:
                        - lvgl.widget.show: alert_hdr_warn
                      else:
                        - lvgl.widget.show: alert_hdr_info
            - globals.set:
                id: alert_active
                value: 'true'
            - globals.set:
                id: alert_shown_at
                value: !lambda 'return millis();'
            - lvgl.page.show: alert_page
            - if:
                condition:
                  lambda: 'return id(cur_timeout) > 0;'
                then:
                  - script.execute: alert_timeout

  - id: alert_timeout
    mode: restart
    then:
      - delay: !lambda 'return id(cur_timeout) * 1000;'
      - script.execute: next_alert

lvgl:
  rotation: 270
  buffer_size: 25%
  disp_bg_color: 0x000000
  default_font: montserrat_20
  style_definitions:
    - id: st_shape
      bg_opa: COVER
      border_width: 0
      pad_all: 0
      outline_width: 0
      shadow_width: 0
    - id: st_clear
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      outline_width: 0
      shadow_width: 0
  pages:
    - id: face_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - obj:
            id: mood_idle
            x: 0
            y: 0
            width: 320
            height: 170
            styles: st_clear
            scrollable: false
            widgets:
              - obj: {x: 60, y: 50, width: 40, height: 40, radius: 22, bg_color: 0xFFFFFF, styles: st_shape}
              - obj: {x: 140, y: 130, width: 40, height: 6, radius: 3, bg_color: 0xFFFFFF, styles: st_shape}
              - obj: {x: 210, y: 50, width: 40, height: 40, radius: 22, bg_color: 0xFFFFFF, styles: st_shape}
        - obj:
            id: mood_blink
            hidden: true
            x: 0
            y: 0
            width: 320
            height: 170
            styles: st_clear
            scrollable: false
            widgets:
              - obj: {x: 67, y: 66, width: 56, height: 8, radius: 4, bg_color: 0xFFFFFF, styles: st_shape}
              - obj: {x: 197, y: 66, width: 56, height: 8, radius: 4, bg_color: 0xFFFFFF, styles: st_shape}
              - obj: {x: 140, y: 130, width: 40, height: 6, radius: 3, bg_color: 0xFFFFFF, styles: st_shape}
        - obj:
            id: mood_happy
            hidden: true
            x: 0
            y: 0
            width: 320
            height: 170
            styles: st_clear
            scrollable: false
            widgets:
              - obj: {x: 60, y: 50, width: 40, height: 40, radius: 22, bg_color: 0xFFFFFF, styles: st_shape}
              - obj: {x: 210, y: 50, width: 40, height: 40, radius: 22, bg_color: 0xFFFFFF, styles: st_shape}
              - obj: {x: 136, y: 112, width: 40, height: 40, radius: 22, bg_color: 0xFFFFFF, styles: st_shape}
              - obj: {x: 276, y: 34, width: 11, height: 80, radius: 8, bg_color: 0xFFFFFF, styles: st_shape}
              - obj: {x: 275, y: 124, width: 12, height: 12, radius: 22, bg_color: 0xFFFFFF, styles: st_shape}
              - obj: {x: 132, y: 106, width: 47, height: 23, radius: 0, bg_color: 0x000000, styles: st_shape}
        - obj:
            id: mood_focus
            hidden: true
            x: 0
            y: 0
            width: 320
            height: 170
            styles: st_clear
            scrollable: false
            widgets:
              - obj: {x: 61, y: 51, width: 40, height: 40, radius: 22, bg_color: 0xFFFFFF, styles: st_shape}
              - obj: {x: 211, y: 50, width: 40, height: 40, radius: 22, bg_color: 0xFFFFFF, styles: st_shape}
              - obj: {x: 140, y: 130, width: 40, height: 2, radius: 8, bg_color: 0xFFFFFF, styles: st_shape}
              - line: {x: 0, y: 0, points: ["195, 72", "213, 40", "250, 40", "195, 72"], line_width: 18, line_color: 0x000000, line_rounded: true}
              - line: {x: 0, y: 0, points: ["121, 73", "103, 41", "66, 41", "121, 73"], line_width: 18, line_color: 0x000000, line_rounded: true}
        - obj:
            id: mood_sleepy
            hidden: true
            x: 0
            y: 0
            width: 320
            height: 170
            styles: st_clear
            scrollable: false
            widgets:
              - obj: {x: 67, y: 70, width: 56, height: 8, radius: 4, bg_color: 0x7890C8, styles: st_shape}
              - obj: {x: 197, y: 70, width: 56, height: 8, radius: 4, bg_color: 0x7890C8, styles: st_shape}
              - obj: {x: 153, y: 125, width: 14, height: 14, radius: 7, bg_color: 0x7890C8, styles: st_shape}
              - label: {text: "Zzz", x: 250, y: 20, text_color: 0x7890C8, text_font: montserrat_32}
        - obj:
            id: mood_chill
            hidden: true
            x: 0
            y: 0
            width: 320
            height: 170
            styles: st_clear
            scrollable: false
            widgets:
              - obj: {x: 60, y: 62, width: 66, height: 18, radius: 9, bg_color: 0x5CC8FF, styles: st_shape}
              - obj: {x: 197, y: 70, width: 56, height: 8, radius: 4, bg_color: 0x7890C8, styles: st_shape}
              - obj: {x: 153, y: 125, width: 14, height: 14, radius: 7, bg_color: 0x7890C8, styles: st_shape}
              - label: {text: "games", x: 250, y: 20, text_color: 0x7890C8, text_font: montserrat_32}
        - label:
            id: status_label
            x: 0
            y: 174
            width: 320
            text: ""
            text_align: CENTER
            text_color: 0xAAAAAA
        - button:
            id: focus_btn
            x: 10
            y: 196
            width: 100
            height: 40
            radius: 12
            bg_color: 0x28A060
            shadow_width: 0
            on_click:
              - if:
                  condition:
                    lambda: 'return id(focus_running);'
                  then:
                    - script.execute: focus_stop
                  else:
                    - script.execute: focus_timer
            widgets:
              - label:
                  id: focus_btn_label
                  align: CENTER
                  text: "Focus"
                  text_color: 0xFFFFFF
        - button:
            id: chill_btn
            x: 132
            y: 196
            width: 84
            height: 40
            radius: 12
            bg_color: 0x2A3A55
            shadow_width: 0
            on_click:
              - script.execute:
                  id: set_chill
                  enable: !lambda 'return !id(chill_on);'
            widgets:
              - label:
                  align: CENTER
                  text: "Chill"
                  text_color: 0xFFFFFF
        - button:
            id: face_tap
            x: 0
            y: 0
            width: 320
            height: 170
            styles: st_clear
            on_click:
              - script.execute: cheer
        - button:
            id: tasks_btn
            x: 222
            y: 196
            width: 88
            height: 40
            radius: 12
            bg_color: 0x2A3A55
            shadow_width: 0
            on_click:
              - script.execute: show_tasks
            widgets:
              - label:
                  id: tasks_btn_label
                  align: CENTER
                  text: "Tasks"
                  text_color: 0xFFFFFF

    - id: tasks_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - obj: {x: 0, y: 0, width: 320, height: 44, radius: 0, bg_color: 0x2A3A55, styles: st_shape}
        - label:
